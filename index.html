<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriConnect Nigeria - Farmer & Buyer Marketplace</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

  <!-- Header / Navigation -->
  <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i data-lucide="sprout" class="w-8 h-8 text-emerald-300"></i>
        <span class="text-xl font-bold tracking-tight">AgriConnect <span class="text-emerald-300">NG</span></span>
      </div>
      
      <!-- Navigation Tabs -->
      <nav class="flex gap-2 bg-emerald-800 p-1 rounded-lg text-sm font-medium">
        <button id="nav-marketplace" onclick="switchTab('marketplace')" class="px-3 py-1.5 rounded-md bg-white text-emerald-800 shadow-sm transition">
          Marketplace
        </button>
        <button id="nav-appointments" onclick="switchTab('appointments')" class="px-3 py-1.5 rounded-md text-emerald-100 hover:text-white transition relative">
          Appointments
          <span id="appointment-badge" class="hidden absolute -top-1 -right-1 bg-amber-500 text-white text-xs rounded-full w-4 h-4 flex items-center justify-center font-bold">0</span>
        </button>
      </nav>

      <button onclick="openModal('add-product-modal')" class="bg-emerald-500 hover:bg-emerald-400 text-white font-medium px-4 py-2 rounded-lg text-sm flex items-center gap-1.5 shadow-sm transition">
        <i data-lucide="plus-circle" class="w-4 h-4"></i>
        Post Produce
      </button>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">

    <!-- MARKETPLACE TAB -->
    <div id="tab-marketplace" class="space-y-6">
      <!-- Search and Filter Bar -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col sm:flex-row gap-4 justify-between items-center">
        <div class="relative w-full sm:w-96">
          <i data-lucide="search" class="w-5 h-5 absolute left-3 top-2.5 text-slate-400"></i>
          <input type="text" id="search-input" oninput="filterProducts()" placeholder="Search produce, farmer, or location..." class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
          <label for="category-filter" class="text-sm font-medium text-slate-600 whitespace-nowrap">Category:</label>
          <select id="category-filter" onchange="filterProducts()" class="bg-slate-50 border border-slate-200 rounded-lg text-sm px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <option value="All">All Categories</option>
            <option value="Grains & Cereals">Grains & Cereals</option>
            <option value="Tubers">Tubers</option>
            <option value="Vegetables">Vegetables</option>
            <option value="Fruits">Fruits</option>
            <option value="Livestock & Poultry">Livestock & Poultry</option>
          </select>
        </div>
      </div>

      <!-- Products Grid -->
      <div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Dynamically Populated -->
      </div>
    </div>

    <!-- APPOINTMENTS TAB -->
    <div id="tab-appointments" class="hidden space-y-6">
      <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold text-slate-900">Scheduled Appointments & Expressed Interest</h2>
        <p class="text-sm text-slate-500">Manage buyer requests and site visits</p>
      </div>

      <div id="appointments-container" class="space-y-4">
        <!-- Dynamically Populated -->
      </div>
    </div>

  </main>

  <!-- MODAL 1: Post New Product (Farmer) -->
  <div id="add-product-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full max-h-[90vh] overflow-y-auto">
      <div class="p-6 border-b border-slate-100 flex justify-between items-center">
        <h3 class="text-lg font-bold text-slate-900">Post New Produce</h3>
        <button onclick="closeModal('add-product-modal')" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <form id="add-product-form" onsubmit="handleCreateProduct(event)" class="p-6 space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Produce Name *</label>
          <input type="text" id="prod-name" required placeholder="e.g. Fresh White Yam" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Price in Naira (₦) *</label>
            <input type="number" id="prod-price" min="1" required placeholder="e.g. 2500" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Unit / Quantity *</label>
            <input type="text" id="prod-unit" required placeholder="e.g. per tuber, 50kg bag" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Category *</label>
          <select id="prod-category" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            <option value="Grains & Cereals">Grains & Cereals</option>
            <option value="Tubers">Tubers</option>
            <option value="Vegetables">Vegetables</option>
            <option value="Fruits">Fruits</option>
            <option value="Livestock & Poultry">Livestock & Poultry</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Farmer / Farm Name *</label>
            <input type="text" id="prod-farmer" required placeholder="e.g. Musa's Agro Farm" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Location *</label>
            <input type="text" id="prod-location" required placeholder="e.g. Benue State" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Contact Phone Number *</label>
          <input type="tel" id="prod-phone" required placeholder="e.g. 08012345678" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Image URL (Optional)</label>
          <input type="url" id="prod-image" placeholder="https://..." class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Description</label>
          <textarea id="prod-desc" rows="3" placeholder="Describe quality, availability, etc." class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
        </div>

        <div class="pt-4 flex justify-end gap-2">
          <button type="button" onclick="closeModal('add-product-modal')" class="px-4 py-2 border text-slate-600 rounded-lg text-sm font-medium hover:bg-slate-50">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-medium">Publish Produce</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL 2: Buyer Interest & Appointment Setup -->
  <div id="appointment-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full max-h-[90vh] overflow-y-auto">
      <div class="p-6 border-b border-slate-100 flex justify-between items-center">
        <div>
          <h3 class="text-lg font-bold text-slate-900">Indicate Interest & Set Appointment</h3>
          <p id="appt-product-title" class="text-sm text-emerald-600 font-medium"></p>
        </div>
        <button onclick="closeModal('appointment-modal')" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <form id="appointment-form" onsubmit="handleCreateAppointment(event)" class="p-6 space-y-4">
        <input type="hidden" id="appt-product-id">

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Your Full Name *</label>
          <input type="text" id="buyer-name" required placeholder="e.g. Chidi Okonkwo" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Your Phone Number *</label>
          <input type="tel" id="buyer-phone" required placeholder="e.g. 08087654321" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Preferred Date *</label>
            <input type="date" id="appt-date" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Preferred Time *</label>
            <input type="time" id="appt-time" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Appointment Purpose *</label>
          <select id="appt-purpose" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            <option value="Inspection & Pickup">Farm Visit, Inspection & Pickup</option>
            <option value="Bulk Purchase Negotiation">Bulk Purchase Negotiation</option>
            <option value="Delivery Arrangement">Delivery Arrangement</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Additional Notes / Quantity Required</label>
          <textarea id="appt-notes" rows="3" placeholder="Mention quantities needed or specific questions for the farmer..." class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
        </div>

        <div class="pt-4 flex justify-end gap-2">
          <button type="button" onclick="closeModal('appointment-modal')" class="px-4 py-2 border text-slate-600 rounded-lg text-sm font-medium hover:bg-slate-50">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-medium">Confirm & Book Appointment</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-slate-900 text-slate-400 py-6 border-t border-slate-800 text-center text-sm">
    <p>&copy; 2026 AgriConnect Nigeria. Empowering local farmers and buyers.</p>
  </footer>

  <!-- Application JavaScript Logic -->
  <script>
    // Initial Sample Data
    const initialProducts = [
      {
        id: "prod-1",
        name: "Fresh White Yam tubers",
        price: 3500,
        unit: "per large tuber",
        category: "Tubers",
        farmer: "Bako Farms Ltd",
        location: "Makurdi, Benue State",
        phone: "08031234567",
        image: "https://images.unsplash.com/photo-1596040033229-a9821ebd058d?auto=format&fit=crop&q=80&w=600",
        description: "Freshly harvested organic white yam tubers. Excellent quality for wholesale or retail."
      },
      {
        id: "prod-2",
        name: "50kg Bag of Foreign Parboiled Rice",
        price: 78000,
        unit: "per 50kg bag",
        category: "Grains & Cereals",
        farmer: "Kano Grain Hub",
        location: "Kano State",
        phone: "08029876543",
        image: "https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&q=80&w=600",
        description: "Stone-free, high yield, long grain rice ready for immediate pickup or delivery."
      },
      {
        id: "prod-3",
        name: "Fresh Tomatoes (Big Basket)",
        price: 22000,
        unit: "per raffia basket",
        category: "Vegetables",
        farmer: "Green Pastures Veggies",
        location: "Jos, Plateau State",
        phone: "08145556677",
        image: "https://images.unsplash.com/photo-1592924357228-91a4daadcfea?auto=format&fit=crop&q=80&w=600",
        description: "Firm, fresh red tomatoes directly from Jos farms. Ideal for markets and restaurants."
      }
    ];

    // State Management
    let products = JSON.parse(localStorage.getItem('agri_products')) || initialProducts;
    let appointments = JSON.parse(localStorage.getItem('agri_appointments')) || [];

    // Save Data to Local Storage
    function saveData() {
      localStorage.setItem('agri_products', JSON.stringify(products));
      localStorage.setItem('agri_appointments', JSON.stringify(appointments));
    }

    // Currency Formatter
    function formatNaira(amount) {
      return '₦' + Number(amount).toLocaleString('en-NG');
    }

    // Switch Tabs
    function switchTab(tab) {
      const marketplaceTab = document.getElementById('tab-marketplace');
      const appointmentsTab = document.getElementById('tab-appointments');
      const navMarketplace = document.getElementById('nav-marketplace');
      const navAppointments = document.getElementById('nav-appointments');

      if (tab === 'marketplace') {
        marketplaceTab.classList.remove('hidden');
        appointmentsTab.classList.add('hidden');
        navMarketplace.className = "px-3 py-1.5 rounded-md bg-white text-emerald-800 shadow-sm transition font-medium";
        navAppointments.className = "px-3 py-1.5 rounded-md text-emerald-100 hover:text-white transition font-medium relative";
      } else {
        marketplaceTab.classList.add('hidden');
        appointmentsTab.classList.remove('hidden');
        navAppointments.className = "px-3 py-1.5 rounded-md bg-white text-emerald-800 shadow-sm transition font-medium relative";
        navMarketplace.className = "px-3 py-1.5 rounded-md text-emerald-100 hover:text-white transition font-medium";
        renderAppointments();
      }
    }

    // Render Products Grid
    function renderProducts(itemsToRender = products) {
      const grid = document.getElementById('products-grid');
      
      if (itemsToRender.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-12 text-center text-slate-500">
            <i data-lucide="package-x" class="w-12 h-12 mx-auto mb-3 text-slate-300"></i>
            <p class="text-lg font-medium">No produce found matching your search.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      grid.innerHTML = itemsToRender.map(product => `
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col hover:shadow-md transition">
          <img src="${product.image || 'https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&q=80&w=600'}" 
               alt="${product.name}" 
               class="w-full h-48 object-cover bg-slate-100"
               onerror="this.src='https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&q=80&w=600'">
          
          <div class="p-5 flex-grow flex flex-col justify-between space-y-4">
            <div>
              <div class="flex items-center justify-between gap-2 mb-2">
                <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-100">
                  ${product.category}
                </span>
                <span class="text-xs text-slate-400 flex items-center gap-1">
                  <i data-lucide="map-pin" class="w-3 h-3"></i> ${product.location}
                </span>
              </div>

              <h3 class="text-lg font-bold text-slate-900 leading-snug">${product.name}</h3>
              <p class="text-sm text-slate-500 mt-1 line-clamp-2">${product.description || 'No additional details provided.'}</p>
            </div>

            <div class="space-y-3 pt-3 border-t border-slate-100">
              <div class="flex items-baseline justify-between">
                <div>
                  <span class="text-2xl font-extrabold text-emerald-700">${formatNaira(product.price)}</span>
                  <span class="text-xs text-slate-500"> / ${product.unit}</span>
                </div>
              </div>

              <div class="text-xs text-slate-600 bg-slate-50 p-2.5 rounded-lg space-y-1">
                <div class="font-semibold text-slate-800">${product.farmer}</div>
                <div class="flex items-center gap-1 text-slate-500">
                  <i data-lucide="phone" class="w-3 h-3"></i> ${product.phone}
                </div>
              </div>

              <button onclick="openAppointmentModal('${product.id}')" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-semibold flex items-center justify-center gap-2 transition shadow-sm">
                <i data-lucide="calendar" class="w-4 h-4"></i>
                Indicate Interest & Set Appointment
              </button>
            </div>
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }

    // Filter Products
    function filterProducts() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const category = document.getElementById('category-filter').value;

      const filtered = products.filter(product => {
        const matchesSearch = product.name.toLowerCase().includes(query) ||
                              product.farmer.toLowerCase().includes(query) ||
                              product.location.toLowerCase().includes(query);
        const matchesCategory = category === 'All' || product.category === category;

        return matchesSearch && matchesCategory;
      });

      renderProducts(filtered);
    }

    // Handle Adding New Produce (Farmer)
    function handleCreateProduct(e) {
      e.preventDefault();
      
      const newProduct = {
        id: 'prod-' + Date.now(),
        name: document.getElementById('prod-name').value,
        price: Number(document.getElementById('prod-price').value),
        unit: document.getElementById('prod-unit').value,
        category: document.getElementById('prod-category').value,
        farmer: document.getElementById('prod-farmer').value,
        location: document.getElementById('prod-location').value,
        phone: document.getElementById('prod-phone').value,
        image: document.getElementById('prod-image').value || 'https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&q=80&w=600',
        description: document.getElementById('prod-desc').value
      };

      products.unshift(newProduct);
      saveData();
      renderProducts();
      closeModal('add-product-modal');
      document.getElementById('add-product-form').reset();
      alert('Produce successfully listed on the marketplace!');
    }

    // Handle Appointment Booking (Buyer)
    function openAppointmentModal(productId) {
      const product = products.find(p => p.id === productId);
      if (!product) return;

      document.getElementById('appt-product-id').value = product.id;
      document.getElementById('appt-product-title').innerText = `${product.name} — Offered by ${product.farmer}`;
      openModal('appointment-modal');
    }

    function handleCreateAppointment(e) {
      e.preventDefault();

      const productId = document.getElementById('appt-product-id').value;
      const product = products.find(p => p.id === productId);

      const newAppointment = {
        id: 'appt-' + Date.now(),
        productName: product ? product.name : 'Produce Item',
        farmerName: product ? product.farmer : 'Farmer',
        farmerPhone: product ? product.phone : 'N/A',
        price: product ? product.price : 0,
        buyerName: document.getElementById('buyer-name').value,
        buyerPhone: document.getElementById('buyer-phone').value,
        date: document.getElementById('appt-date').value,
        time: document.getElementById('appt-time').value,
        purpose: document.getElementById('appt-purpose').value,
        notes: document.getElementById('appt-notes').value,
        status: 'Pending'
      };

      appointments.unshift(newAppointment);
      saveData();
      updateAppointmentBadge();
      closeModal('appointment-modal');
      document.getElementById('appointment-form').reset();
      alert('Your appointment request and interest have been registered!');
    }

    // Render Appointments
    function renderAppointments() {
      const container = document.getElementById('appointments-container');

      if (appointments.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-12 rounded-2xl border border-slate-200 text-center text-slate-500">
            <i data-lucide="calendar-x" class="w-12 h-12 mx-auto mb-3 text-slate-300"></i>
            <p class="text-lg font-medium">No appointments or interest indications recorded yet.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      container.innerHTML = appointments.map(appt => `
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between gap-4">
          <div class="space-y-2">
            <div class="flex items-center gap-2">
              <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold ${appt.status === 'Pending' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}">
                ${appt.status}
              </span>
              <span class="text-xs text-slate-400">ID: ${appt.id}</span>
            </div>
            
            <h4 class="text-lg font-bold text-slate-900">${appt.productName}</h4>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-1 text-sm text-slate-600">
              <p><strong>Buyer:</strong> ${appt.buyerName} (${appt.buyerPhone})</p>
              <p><strong>Farmer:</strong> ${appt.farmerName} (${appt.farmerPhone})</p>
              <p><strong>Schedule:</strong> ${appt.date} at ${appt.time}</p>
              <p><strong>Purpose:</strong> ${appt.purpose}</p>
            </div>

            ${appt.notes ? `<p class="text-xs bg-slate-50 p-3 rounded-lg text-slate-600 mt-2"><strong>Notes:</strong> ${appt.notes}</p>` : ''}
          </div>

          <div class="flex md:flex-col justify-end items-end gap-2 border-t md:border-t-0 pt-4 md:pt-0 border-slate-100">
            <a href="tel:${appt.buyerPhone}" class="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 rounded-lg text-xs font-semibold flex items-center gap-1.5">
              <i data-lucide="phone-call" class="w-3.5 h-3.5"></i> Call Buyer
            </a>
            <button onclick="deleteAppointment('${appt.id}')" class="px-3 py-1.5 bg-slate-100 hover:bg-red-50 text-slate-600 hover:text-red-600 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Remove
            </button>
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }

    function deleteAppointment(id) {
      if (confirm('Are you sure you want to remove this appointment?')) {
        appointments = appointments.filter(a => a.id !== id);
        saveData();
        renderAppointments();
        updateAppointmentBadge();
      }
    }

    function updateAppointmentBadge() {
      const badge = document.getElementById('appointment-badge');
      if (appointments.length > 0) {
        badge.innerText = appointments.length;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    // Modal Helpers
    function openModal(id) {
      document.getElementById(id).classList.remove('hidden');
      document.getElementById(id).classList.add('flex');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
      document.getElementById(id).classList.remove('flex');
    }

    // Initialize App
    window.onload = function() {
      renderProducts();
      updateAppointmentBadge();
      lucide.createIcons();
    };
  </script>
</body>
</html>
